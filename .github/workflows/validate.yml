name: Valider les skills

# Gratuit : aucun appel au modèle. Tourne sur chaque push et chaque PR.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frontmatter, descriptions, renvois, recouvrements
        run: python3 scripts/validate.py
